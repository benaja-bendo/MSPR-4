# Copier et adapter avant application :
#   Copy-Item deploy\k8s\secrets.example.yaml deploy\k8s\secrets.yaml
#   kubectl apply -f deploy\k8s\secrets.yaml
#
# Ne commitez JAMAIS secrets.yaml avec de vraies clés de production.

apiVersion: v1
kind: Secret
metadata:
  name: cofrap-app-secrets
  namespace: openfaas-fn
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:postgres@postgres.cofrap.svc.cluster.local:5432/cofrap?schema=public"
  ENCRYPTION_KEY: "change-me-32-chars-minimum-secret!!"
