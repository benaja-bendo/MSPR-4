# Ingress unifié : frontend + OpenFaaS Gateway
# Prérequis : minikube addons enable ingress
# Accès : http://cofrap.local (ajouter dans C:\Windows\System32\drivers\etc\hosts → IP minikube)

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cofrap
  namespace: cofrap
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: cofrap.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openfaas-functions
  namespace: openfaas
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: cofrap.local
      http:
        paths:
          - path: /function
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
