# Base PostgreSQL pour le développement local COFRAP MSPR
# Démarrage : docker compose up -d
# Arrêt     : docker compose down

services:
  postgres:
    image: postgres:16-alpine
    container_name: cofrap-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cofrap
    volumes:
      - cofrap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cofrap"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cofrap_pgdata:
